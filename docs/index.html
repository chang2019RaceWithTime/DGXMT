  <script>
    const data = JSON.parse(document.getElementById('payload').textContent);
    const nodes = Object.fromEntries(['phone', 'page-top', 'page-title', 'screen', 'viewport', 'wxss', 'tabs', 'back', 'modal', 'modal-title', 'modal-content', 'modal-cancel', 'modal-ok', 'toast'].map(id => [id, document.getElementById(id)]));
    const storage = new Map([['login', true], ['usrname', 'demo-student'], ['password', 'demo-only']]);
    const today = new Date();
    const todayKey = [today.getFullYear(), today.getMonth() + 1, today.getDate()].join('/');
    const rows = [{ names: '演示同学', notes: '19:00 组会 · 学院会议室', posttime: todayKey }];
    const menuPages = new Set(['home', 'login']);
    const stack = [];
    let activePage;
    let pendingRender;
    let toastTimer;
    let modalOptions;

    const demoTimetable = [
      { week: 1, rank: 1, class: '数据结构', place: '教二 204' },
      { week: 3, rank: 1, class: '通信原理', place: '教一 301' },
      { week: 5, rank: 1, class: '计算机网络', place: '教二 106' },
      { week: 2, rank: 2, class: '概率论', place: '教三 202' },
      { week: 4, rank: 2, class: 'Python 实践', place: '实验楼 305' },
      { week: 1, rank: 3, class: '数字信号处理', place: '教一 107' },
      { week: 5, rank: 3, class: '专业英语', place: '教二 312' }
    ];
    const demoGrades = [
      { name: '数据结构', xuefen: 4, number: 93 },
      { name: '计算机网络', xuefen: 3, number: 91 },
      { name: '通信原理', xuefen: 4, number: 89 },
      { name: 'Python 实践', xuefen: 2, number: 96 },
      { name: '概率论', xuefen: 3, number: 90 }
    ];
    const fixtures = {
      grades: demoGrades,
      exam: [
        { name: '通信原理', time: '12月18日 09:00', kaochang: '教一 301', zuoweihao: 12 },
        { name: '计算机网络', time: '12月21日 14:00', kaochang: '教二 106', zuoweihao: 6 }
      ],
      excel: [
        { zhuti: '校园活动采编会', shijian: '周三 19:00', renyuan: '演示同学', neirong: '讨论校园活动报道与摄影分工。' },
        { zhuti: '小程序更新讨论', shijian: '周五 18:30', renyuan: '程序部', neirong: '核对课表查询和日程页面。' }
      ]
    };

    const repaint = () => {
      if (!pendingRender) pendingRender = requestAnimationFrame(() => {
        pendingRender = null;
        render();
      });
    };
    function notify(title) {
      nodes.toast.textContent = title;
      nodes.toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { nodes.toast.hidden = true; }, 1500);
    }
    function showModal(options) {
      modalOptions = options;
      nodes['modal-title'].textContent = options.title || '提示';
      nodes['modal-content'].textContent = options.content || '';
      nodes['modal-cancel'].hidden = options.showCancel === false;
      nodes.modal.hidden = false;
      nodes['modal-ok'].focus();
    }
    function closeModal(confirm) {
      const options = modalOptions;
      modalOptions = null;
      nodes.modal.hidden = true;
      const result = { confirm, cancel: !confirm };
      options?.success?.(result);
      options?.complete?.(result);
    }
    function collection() {
      let filter = {};
      const matches = row => Object.entries(filter).every(([key, value]) => row[key] === value);
      return {
        orderBy() { return this; },
        where(values) { filter = values; return this; },
        async get() { return { data: rows.filter(matches).map(row => ({ ...row })) }; },
        async add({ data: row }) {
          if (row.names?.trim() && row.notes?.trim()) rows.push({ ...row });
          return { _id: 'demo-' + rows.length };
        },
        async remove() {
          for (let i = rows.length - 1; i >= 0; i--) if (matches(rows[i])) rows.splice(i, 1);
          return { stats: { removed: 1 } };
        }
      };
    }
    function handleRequest(options) {
      const operation = options.url.split('/').pop();
      let result = fixtures[operation];
      if (operation === 'kbtable') {
        const week = Number(options.data?.zc);
        result = week % 2 === 0 ? demoTimetable : demoTimetable.slice(1).concat({ week: 1, rank: 1, class: '算法设计', place: '教三 203' });
      }
      queueMicrotask(() => {
        if (result) options.success?.({ statusCode: 200, data: { data: structuredClone(result) } });
        else options.fail?.({ errMsg: '此功能需要原服务' });
      });
    }
    const wx = {
      request: handleRequest,
      cloud: { database: () => ({ collection }) },
      getStorageSync: key => storage.get(key),
      getStorage: ({ key, success, fail }) => queueMicrotask(() => storage.has(key) ? success?.({ data: storage.get(key) }) : fail?.({ errMsg: 'storage not found' })),
      setStorage: ({ key, data: value, success }) => { storage.set(key, value); success?.({}); },
      removeStorage: ({ key, success }) => { storage.delete(key); success?.({}); },
      switchTab: ({ url }) => navigate(url, 'tab'),
      navigateTo: ({ url }) => navigate(url, 'push'),
      redirectTo: ({ url }) => navigate(url, 'replace'),
      navigateToMiniProgram: () => notify('这个入口需在微信中打开'),
      showToast: ({ title }) => notify(title),
      showModal,
      setClipboardData: () => notify('演示模式未访问系统剪贴板')
    };
    const quietConsole = { log() {}, info() {}, warn() {} };
    class SemesterDate extends Date {
      constructor(...args) { super(...(args.length ? args : [2021, 9, 11, 12])); }
    }
    function navigate(url, action = 'push') {
      const name = url.split('?')[0].split('/').filter(Boolean).pop();
      const spec = data.pages[name];
      if (!spec) { notify('该入口需要原业务服务'); return; }
      activePage?.instance.onHide?.();
      if (action === 'tab') stack.length = 0;
      if (action === 'push' && activePage) stack.push(activePage.name);
      const registration = callback => (page = callback);
      let page;
      const util = { formatTime: date => date.toLocaleString('zh-CN') };
      const localRequire = name => {
        if (name.endsWith('/utils/util.js')) return util;
        throw Error('预览缺少本地模块 ' + name);
      };
      new Function('wx', 'Page', 'getApp', 'require', 'console', 'Date', spec.logic)(
        wx, registration, () => ({ globalData: {} }), localRequire, quietConsole,
        ['kbtable', 'login'].includes(name) ? SemesterDate : Date
      );
      const state = { name, spec, instance: page };
      page.data = structuredClone(page.data || {});
      page.setData = (update, done) => {
        Object.assign(page.data, update);
        if (activePage === state) repaint();
        done?.();
      };
      activePage = state;
      nodes.viewport.scrollTop = 0;
      page.onLoad?.({});
      page.onShow?.();
      page.onReady?.();
      render();
    }

    function normalizeAsset(page, src) {
      if (src.startsWith('cloud://')) return '';
      if (/^(https?:|data:)/i.test(src)) return '';
      const base = 'https://local.invalid/pages/' + page + '/';
      return data.assets[decodeURIComponent(new URL(src, base).pathname.slice(1))] || '';
    }
    function responsiveStyle(style) {
      const width = nodes.viewport.clientWidth || 375;
      return style.replace(/(-?(?:\d*\.)?\d+)rpx\b/g, (_, n) => (Number(n) * width / 750) + 'px');
    }
    function invoke(page, handler, attributes, detail = {}) {
      if (!handler || typeof page[handler] !== 'function') return;
      const dataset = {};
      for (const [key, value] of Object.entries(attributes)) {
        if (key.startsWith('data-')) dataset[key.slice(5).replace(/-([a-z])/g, (_, x) => x.toUpperCase())] = value;
      }
      page[handler]({ currentTarget: { dataset }, target: { dataset }, detail });
    }
    function append(target, node, state) {
      if (node == null) return;
      if (typeof node !== 'object') { target.append(document.createTextNode(node)); return; }
      const children = node.children || [];
      if (node.tag === 'wx-page' || node.tag === 'virtual') {
        children.forEach(child => append(target, child, state));
        return;
      }
      const attr = node.attr || {};
      if (node.tag === 'wx-swiper' && state.name === 'login') {
        const banner = document.createElement('div');
        banner.className = 'preview-demo-banner';
        banner.textContent = 'DGXMT 校园日程';
        banner.style.height = responsiveStyle('490rpx');
        target.append(banner);
        return;
      }
      if (node.tag === 'wx-open-data') {
        const card = document.createElement('div');
        card.className = 'preview-user-card';
        card.textContent = '演示用户';
        target.append(card);
        return;
      }
      const baseTags = { 'wx-form': 'form', 'wx-input': 'input', 'wx-textarea': 'textarea', 'wx-label': 'label' };
      const el = document.createElement(baseTags[node.tag] || node.tag);
      for (const [key, value] of Object.entries(attr)) {
        if (value == null || typeof value === 'object' || /^(bind|catch)/.test(key) || key === 'src') continue;
        el.setAttribute(key, key === 'style' ? responsiveStyle(String(value)) : String(value));
      }
      if (node.tag === 'wx-image' && attr.src) {
        const localSrc = normalizeAsset(state.name, String(attr.src));
        if (localSrc) {
          const img = document.createElement('img');
          img.alt = '';
          img.src = localSrc;
          el.append(img);
        }
      }
      if (node.tag === 'wx-input' && state.name === 'login') {
        el.value = attr.name === 'usrname' ? 'demo-student' : 'demo-only';
        el.type = attr.name === 'usrname' ? 'text' : 'password';
        el.readOnly = true;
        el.setAttribute('aria-label', attr.name === 'usrname' ? '演示学号' : '演示密码');
      }
      if (node.tag === 'wx-mp-cell' && attr.value) el.append(document.createTextNode(attr.value));
      const handler = attr.bindtap || attr['bind:tap'] || attr.catchtap;
      const activate = event => {
        if (attr.catchtap) event.stopPropagation();
        if (handler) invoke(state.instance, handler, attr);
        if (attr['form-type'] === 'submit') el.closest('form')?.requestSubmit();
        if (attr.url && !handler) navigate(attr.url);
      };
      if (handler || attr.url || node.tag === 'wx-button') {
        el.setAttribute('role', 'button');
        el.tabIndex = 0;
        el.addEventListener('click', activate);
        el.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); activate(event); }
        });
      }
      if (attr.bindinput) el.addEventListener('input', () => invoke(state.instance, attr.bindinput, attr, { value: el.value }));
      if (attr.bindsubmit) el.addEventListener('submit', event => {
        event.preventDefault();
        invoke(state.instance, attr.bindsubmit, attr, { value: Object.fromEntries(new FormData(el)) });
      });
      children.forEach(child => append(el, child, state));
      target.append(el);
    }
    function compiledStyles(name, width) {
      const fragments = [];
      const appendSheet = content => (suffix = '', options) => {
        const pxWidth = options?.deviceWidth || width;
        const expand = value => (typeof value === 'string' ? data.common[value] : value || []).map(token => {
          if (typeof token === 'string') return token;
          if (token[0] === 0) return (token[1] * pxWidth / 750) + 'px';
          if (token[0] === 1) return suffix;
          if (token[0] === 2) return expand(token[1]);
          return '';
        }).join('');
        fragments.push(expand(content));
      };
      for (const nameKey of ['app', name]) {
        const renderer = data.styles[nameKey];
        if (renderer) new Function('setCssToHead', 'return ' + renderer)(appendSheet)('', { deviceWidth: width });
      }
      return fragments.join('\n').replace(/(^|[}\n])\s*body(?=\s*\{)/g, '$1\n#screen')
        .replace(/url\([^)]*\)/gi, 'none');
    }
    function render() {
      if (!activePage) return;
      const { name, spec, instance } = activePage;
      nodes['page-title'].textContent = spec.title;
      nodes['page-top'].style.backgroundColor = spec.header;
      nodes.tabs.hidden = !menuPages.has(name);
      nodes.back.hidden = menuPages.has(name);
      nodes.screen.dataset.page = name;
      const wxml = $gwx('pages/' + name + '/' + name + '.wxml');
      const fragment = document.createDocumentFragment();
      append(fragment, wxml(instance.data), activePage);
      nodes.screen.replaceChildren(fragment);
      nodes.wxss.textContent = compiledStyles(name, nodes.viewport.clientWidth || 375);
      document.querySelectorAll('button[data-page]').forEach(button => {
        if (button.dataset.page === name) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      });
    }
    for (const entry of data.tabs) {
      const button = document.createElement('button');
      button.type = 'button';
      button.dataset.page = entry.page;
      const img = document.createElement('img');
      img.alt = '';
      img.src = data.assets[entry.icon];
      button.append(img, document.createTextNode(entry.text));
      nodes.tabs.append(button);
    }
    document.addEventListener('click', event => {
      const button = event.target.closest('button[data-page]');
      if (button) navigate(button.dataset.page, menuPages.has(button.dataset.page) ? 'tab' : 'push');
    });
    nodes.back.addEventListener('click', () => {
      activePage?.instance.onUnload?.();
      navigate(stack.pop() || 'home', 'replace');
    });
    nodes['modal-ok'].addEventListener('click', () => closeModal(true));
    nodes['modal-cancel'].addEventListener('click', () => closeModal(false));
    window.addEventListener('resize', repaint);
    navigate('home', 'tab');
  </script>
